[package]
name = "fastgmad"
version = "0.3.3"
edition = "2021"
authors = ["William Venner, VermeilChan"]
license = "MIT OR Apache-2.0"
description = "Fast gmad implementation"
repository = "https://github.com/VermeilChan/fastgmad"
resolver = "2"

[features]
binary = ["dep:libloading", "dep:ctrlc"]

[dependencies]
walkdir = "2.5.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
memchr = "2.7.4"
byteorder = "1.5.0"
uuid = { version = "1.11.1", features = ["v4"] }
log = "0.4.22"
thiserror = "2.0.11"

ctrlc = { version = "3.4.5", optional = true }
libloading = { version = "0.8.6", optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["stringapiset"] }

[dev-dependencies]
lazy_static = "1.5.0"
sysreq = "0.1.6"
zip = "2.2.2"

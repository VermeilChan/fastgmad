[package]
name = "fastgmad"
version = "0.4.0"
edition = "2024"
authors = ["William Venner, Mitra-88"]
license = "MIT OR Apache-2.0"
description = "Fast gmad implementation"
repository = "https://github.com/Mitra-88/fastgmad"
resolver = "3"

[features]
binary = ["dep:libloading", "dep:ctrlc"]

[dependencies]
walkdir = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
memchr = "2.8.3"
byteorder = "1.5.0"
uuid = { version = "1.24.0", features = ["v4"] }
log = "0.4.33"
thiserror = "2.0.19"

ctrlc = { version = "3.5.2", optional = true }
libloading = { version = "0.9.0", optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["stringapiset"] }

[dev-dependencies]
lazy_static = "1.5.0"
sysreq = "0.1.7"
zip = "8.6.0"

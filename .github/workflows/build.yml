name: Build FastGmad

on:
  push:
    branches: [updated-fastgmad]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_suffix: Windows-x86-64-v3
            exe_ext: ".exe"

          - os: ubuntu-latest
            artifact_suffix: Linux-x86-64-v3
            exe_ext: ""

          - os: macos-latest
            artifact_suffix: macOS-ARM64-AppleSilicon
            exe_ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        if: matrix.os == 'ubuntu-latest'
        uses: rui314/setup-mold@v1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Get short commit SHA
        id: sha
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: cargo build --release --package fastgmad-bin --bin fastgmad
        env:
          CARGO_TERM_COLOR: always
          RUSTC_WRAPPER: ""

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: FastGmad-${{ matrix.artifact_suffix }}
          path: |
            ./target/release/fastgmad${{ matrix.exe_ext }}
